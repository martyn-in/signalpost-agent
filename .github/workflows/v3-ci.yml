name: Signalpost V3 CI
on:
  push:
    branches: [v3-external-recall-direct]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: PYTHONPATH=src python -m pytest -q
      - run: PYTHONPATH=src python scripts/validate_builderr_contract.py
